
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel KIBOAS — O Garçom</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#151a20;
 color:white;
 font-family:Arial,sans-serif;
}

#game-wrap{
 position:fixed;
 inset:0;
}

canvas{
 width:100%;
 height:100%;
 display:block;
}

#dialogue{
 position:absolute;
 left:50%;
 bottom:9%;
 transform:translateX(-50%);
 width:min(650px,90%);
 padding:22px;
 border:3px solid #e8bd72;
 border-radius:18px;
 background:#101827ee;
 text-align:center;
 box-shadow:0 10px 35px #000a;
 display:none;
}

#dialogue h2{
 color:#f4d18a;
 margin:0 0 12px;
 font-size:clamp(20px,4vw,32px);
}

#dialogue p{
 font-size:clamp(16px,3vw,24px);
 margin:0;
 line-height:1.5;
}

#start{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 padding:18px 30px;
 border:0;
 border-radius:12px;
 background:linear-gradient(135deg,#f4d18a,#d99d43);
 font-weight:bold;
 font-size:20px;
 cursor:pointer;
 z-index:5;
}

</style>
</head>

<body>

<div id="game-wrap">
<canvas id="game"></canvas>

<button id="start">COMEÇAR CENA</button>

<div id="dialogue">
<h2>GARÇOM DO HOTEL KIBOAS</h2>
<p id="message">Bom dia! Pode tirar uma cópia para mim, por favor?</p>
</div>
</div>

<script>
(()=>{
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const dialogue=document.getElementById('dialogue');

let W=0,H=0;
let frame=0;
let running=false;
let arrived=false;

let waiterX=-250;
let targetX=0;

const image=new Image();
image.src='recepcao-jogo.jpg';

function resize(){
 W=canvas.width=window.innerWidth;
 H=canvas.height=window.innerHeight;
 targetX=W*.55;
}

window.addEventListener('resize',resize);
resize();

function background(){

 ctx.fillStyle='#29231e';
 ctx.fillRect(0,0,W,H);

 if(image.complete && image.naturalWidth){

  const scale=Math.max(
   W/image.naturalWidth,
   H/image.naturalHeight
  );

  const sw=W/scale;
  const sh=H/scale;

  ctx.drawImage(
   image,
   (image.naturalWidth-sw)/2,
   (image.naturalHeight-sh)/2,
   sw,sh,
   0,0,W,H
  );

 }else{

  ctx.fillStyle='#65462f';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#e8bd72';
  ctx.font='bold 30px Arial';
  ctx.textAlign='center';
  ctx.fillText('HOTEL KIBOAS',W/2,H*.2);
 }

 ctx.fillStyle='#0005';
 ctx.fillRect(0,0,W,H);

 // Balcão da receção
 ctx.fillStyle='#4a3020';
 ctx.fillRect(W*.12,H*.69,W*.76,H*.17);

 ctx.fillStyle='#bd955d';
 ctx.fillRect(W*.12,H*.69,W*.76,9);

 ctx.fillStyle='#241914';
 ctx.fillRect(W*.12,H*.86,W*.76,H*.04);

 ctx.fillStyle='#f1d18b';
 ctx.font='bold 24px Georgia';
 ctx.textAlign='center';
 ctx.fillText('RECEPÇÃO — HOTEL KIBOAS',W*.5,H*.665);
}


// GARÇOM GIGANTE
// Personagem desenhado em escala 10 vezes superior

function drawWaiter(x,y){

 ctx.save();

 ctx.translate(x,y);

 const bob=Math.sin(frame*.06)*3;

 // Escala dez vezes maior
 ctx.scale(10,10);

 // Sombra
 ctx.fillStyle='#0008';
 ctx.beginPath();
 ctx.ellipse(0,49,27,7,0,0,Math.PI*2);
 ctx.fill();

 // Calças pretas
 ctx.strokeStyle='#111316';
 ctx.lineWidth=12;
 ctx.lineCap='round';

 ctx.beginPath();
 ctx.moveTo(-7,14);
 ctx.lineTo(-9,43);

 ctx.moveTo(7,14);
 ctx.lineTo(9,43);
 ctx.stroke();

 // Sapatos
 ctx.strokeStyle='#08090a';
 ctx.lineWidth=7;

 ctx.beginPath();
 ctx.moveTo(-9,43);
 ctx.lineTo(-19,46);

 ctx.moveTo(9,43);
 ctx.lineTo(19,46);
 ctx.stroke();

 // Camisa branca
 ctx.fillStyle='#f7f5ee';

 ctx.beginPath();
 ctx.moveTo(-16,-22);
 ctx.lineTo(16,-22);
 ctx.lineTo(20,24);
 ctx.lineTo(-20,24);
 ctx.closePath();
 ctx.fill();

 // Gola
 ctx.fillStyle='#e4e0d8';

 ctx.beginPath();
 ctx.moveTo(-8,-22);
 ctx.lineTo(0,-11);
 ctx.lineTo(8,-22);
 ctx.closePath();
 ctx.fill();

 // Avental amarelo
 ctx.fillStyle='#efc52f';
 ctx.fillRect(-19,5,38,17);

 ctx.strokeStyle='#b98b17';
 ctx.lineWidth=1.5;
 ctx.strokeRect(-19,5,38,17);

 // Bolso
 ctx.strokeStyle='#a77c16';
 ctx.strokeRect(-11,9,11,8);

 // Braço direito levantado
 ctx.strokeStyle='#f7f5ee';
 ctx.lineWidth=9;
 ctx.lineCap='round';

 ctx.beginPath();
 ctx.moveTo(15,-14);
 ctx.lineTo(29,-27);
 ctx.lineTo(39,-37);
 ctx.stroke();

 // Mão
 ctx.fillStyle='#d9a17e';
 ctx.beginPath();
 ctx.arc(40,-39+bob,6,0,Math.PI*2);
 ctx.fill();

 // Braço esquerdo
 ctx.strokeStyle='#f7f5ee';
 ctx.lineWidth=9;

 ctx.beginPath();
 ctx.moveTo(-15,-14);
 ctx.lineTo(-25,8);
 ctx.stroke();

 // Pescoço
 ctx.fillStyle='#d9a17e';
 ctx.fillRect(-5,-31,10,13);

 // Cabeça
 ctx.beginPath();
 ctx.ellipse(0,-40+bob,14,17,0,0,Math.PI*2);
 ctx.fill();

 // Cabelo
 ctx.fillStyle='#29211d';

 ctx.beginPath();
 ctx.moveTo(-14,-43+bob);
 ctx.quadraticCurveTo(-12,-62+bob,5,-58+bob);
 ctx.quadraticCurveTo(17,-55+bob,13,-39+bob);
 ctx.quadraticCurveTo(4,-49+bob,-4,-47+bob);
 ctx.closePath();
 ctx.fill();

 // Olhos
 ctx.fillStyle='#25201d';

 ctx.beginPath();
 ctx.arc(-5,-40+bob,1.4,0,Math.PI*2);
 ctx.arc(5,-40+bob,1.4,0,Math.PI*2);
 ctx.fill();

 // Sorriso
 ctx.strokeStyle='#80513f';
 ctx.lineWidth=1;

 ctx.beginPath();
 ctx.moveTo(-3,-33+bob);
 ctx.quadraticCurveTo(0,-31+bob,3,-33+bob);
 ctx.stroke();

 ctx.restore();
}


function draw(){

 background();

 // Garçom é o único personagem
 drawWaiter(waiterX,H*.57);

 if(running && !arrived){

  waiterX+=2.2;

  if(waiterX>=targetX){
   waiterX=targetX;
   arrived=true;

   dialogue.style.display='block';
   document.getElementById('message').textContent=
    'Bom dia! Pode tirar uma cópia para mim, por favor?';
  }
 }

 frame++;

 requestAnimationFrame(draw);
}


start.addEventListener('click',()=>{

 running=true;
 arrived=false;
 waiterX=-250;

 start.style.display='none';
 dialogue.style.display='none';

});

draw();

})();
</script>

</body>
</html>
