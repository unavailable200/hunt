// ================================================
// PLANTA
// ================================================
function drawPlant(x,y){
ctx.fillStyle="#80563b";
ctx.fillRect(x-17,y,34,35);
ctx.fillStyle="#ad8058";
ctx.fillRect(x-21,y,42,7);
ctx.strokeStyle="#315b36";

for(let i=0;i<8;i++){
ctx.beginPath();
ctx.moveTo(x,y);
ctx.quadraticCurveTo(
x+rand(-25,25),
  y-35,
x+rand(-45,45),
y-75
);
ctx.stroke();
}
ctx.fillStyle="#477d43";
for(let i=0;i<10;i++){
ctx.beginPath();
ctx.ellipse(
x+rand(-30,30),
y-rand(25,70),
8,14,rand(-1,1),0,Math.PI*2
);
ctx.fill();
} }
// ================================================
// BALCÃO DE MÁRMORE
// ================================================
function drawReceptionDesk(){
let x=W*.43;
let y=H*.65;
let width=W*.55;
let height=H*.19;
// Frente do balcão
let desk=ctx.createLinearGradient(x,y,x,y+height);
desk.addColorStop(0,"#80634d");
desk.addColorStop(.25,"#c0a48a");
desk.addColorStop(.55,"#8d7058");
desk.addColorStop(1,"#49382d");
ctx.fillStyle=desk;
ctx.fillRect(x,y,width,height);
// Veios do mármore
ctx.strokeStyle="#d5bca1";
ctx.lineWidth=2;
for(let i=0;i<7;i++){
ctx.beginPath();
ctx.moveTo(x+rand(0,width),y+10+i*15);
ctx.bezierCurveTo(
x+rand(0,width),y+25,
x+rand(0,width),y+50,
x+rand(0,width),y+height-5
);
ctx.stroke();
}
// Parte superior do balcão
let top=ctx.createLinearGradient(0,y-12,0,y+10);
top.addColorStop(0,"#e3d0b7");
top.addColorStop(.5,"#aa9077");
top.addColorStop(1,"#6b5241");
ctx.fillStyle=top;
ctx.fillRect(x-8,y-12,width+16,16);
  ctx.strokeStyle="#e4c9a5";
ctx.lineWidth=2;
ctx.strokeRect(x-8,y-12,width+16,16);
// Painéis da frente
ctx.strokeStyle="#493629";
ctx.lineWid
th=3;
for(let i=0;i<4;i++){
let px=x+i*width/4;
ctx.strokeRect(px+8,y+18,width/4-16,height-28);
}
// Letreiro
ctx.fillStyle="#f1d8ac";
ctx.font="bold 18px Arial";
ctx.textAlign="center";
ctx.fillText("RECEÇÃO",x+width*.45,y+height*.55);
}

// ================================================
// GRUPOS DE CLIENTES
// ================================================
function createGroup(){
let total=Math.min(12+phase*2,26);
let columns=5;
  let spacing=Math.min(48,W*.085);
for(let i=0;i<total;i++){
let col=i%columns;
let row=Math.floor(i/columns);
let targetX=Math.min(
W*.88,
W*.70+col*spacing
);
let targetY=H*.55+row*Math.min(43,H*.065);
let g=createGuest(
W+70+col*15,
targetY,
true
);
g.targetX=targetX;
g.targetY=targetY;
g.speed=rand(.7,1.1)+phase*.035;
g.bag=true;
}
toast("CHEGOU UM GRUPO DE "+total+" CLIENTES COM BAGAGEM!");
}

guests.push(g);
return g;
}

eRect(r*.25,r*.15,r*.85,r*.42);

// ================================================
// BALÕES DE FALA
// ================================================
function drawSpeech(x,y,message,color){
ctx.save();
ctx.font="bold 11px Arial";
let width=Math.min(
ctx.measureText(message).width+20,
W*.88
);
let bx=Math.max(
width/2+5,
Math.min(W-width/2-5,x)
);
ctx.fillStyle=color;
ctx.strokeStyle="#bd7950";
ctx.lineWidth=2;
ctx.beginPath();
ctx.roundRect(
bx-width/2,
y-22,
width,
35,
7
);
ctx.fill();
ctx.stroke();
ctx.fillStyle="#38251c";
ctx.textAlign="center";
ctx.font="bold 10px Arial";
ctx.fillText(message,bx,y);
ctx.restore();
  }
// ================================================
// FLECHAS
// ================================================
function drawArrow(a){
ctx.save();
ctx.translate(a.x,a.y);
ctx.rotate(a.angle);
ctx.strokeStyle="#e6d2a7";
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(-23,0);
ctx.lineTo(24,0);
ctx.stroke();
ctx.fillStyle="#ffcf72";
ctx.beginPath();
ctx.moveTo(24,0);
ctx.lineTo(15,-5);
ctx.lineTo(15,5);
ctx.fill();
ctx.restore();
}
// ================================================
// EFEITOS
// ================================================
function splash(x,y){
for(let i=0;i<18;i++){
let a=rand(0,Math.PI*2);
let s=rand(1.5,5);
particles.push({
x,y,
vx:Math.cos(a)*s,
vy:Math.sin(a)*s,
life:30,
max:30,
size:rand(2,5),
color:"#ff7583"
});
} }
function updateParticles(dt){
for(let o of odorTrail) o.life-=dt;
odorTrail=odorTrail.filter(o=>o.life>0);
for(let p of particles){
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.life-=dt;
}
particles=particles.filter(p=>p.life>0);
}
  function drawParticles(){
for(let p of particles){
ctx.globalAlpha=p.life/p.max;
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
}
// ================================================
// HUD
// ================================================
function updateHUD(){
let vals=[
["FASE",phase],
["PONTOS",score],
["RECORDE",best],
["FLECHAS","➶ "+ammo],
["VIDAS","♥ ".repeat(lives)]
];
$("hud").innerHTML=vals.map(v=>
`<div class="stat">
<label>${v[0]}</label>
<b>${v[1]}</b>
</div>`
).join("");
$("phaseLabel").textContent=
`FASE ${phase} · ${kills}/${needed}`;
$("progressFill").style.width=
Math.min(100,kills/needed*100)+"%";
}
// ================================================
// AVISOS
// ================================================
function toast(m){
$("toast").textContent=m;
$("toast").style.opacity=1;
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>{
$("toast").style.opacity=0;
},2200);
}
// ================================================
// INICIAR JOGO
// ================================================
function startGame(){
score=0;
phase=1;
lives=5;
ammo=65;
combo=0;
kills=0;
  needed=7;
guests=[];
arrows=[];
particles=[];
odorTrail=[]; ghostPassed=false; ghostActive=false; ghostTimer=0; odorTimer=0;
spawnTimer=0;
groupTimer=0;
thiefTimer=0;
blondeTimer=0;
bellhopTimer=0;
complaintTimer=0;
receptionistTimer=0;
receptionistVisible=false;
receptionistDuration=0;
active=true;
$("screen").style.display="none";
createGroup();
createSpecial("bellhop");
updateHUD();
}
// ================================================
// DISPARAR
// ================================================
function shoot(){
if(!active||ammo<=0)return;
ammo--;
let a=Math.atan2(
mouse.y-bow.y,
mouse.x-bow.x
);
arrows.push({
x:bow.x+Math.cos(a)*45,
y:bow.y+Math.sin(a)*45,
vx:Math.cos(a)*16,
vy:Math.sin(a)*16,
angle:a,
life:100,
hit:new Set()
});
updateHUD();
}
// ================================================
// PRÓXIMA FASE
// ================================================
function nextPhase(){
if(kills<needed)return;
phase++;
kills=0;
needed=7+phase*2;
ammo+=25;
lives=Math.min(5,lives+1);
updateHUD();
  toast("FASE "+phase+"! NOVO GRUPO A CHEGAR!");
createGroup();
}
// ================================================
// FIM DE JOGO
// ================================================
function gameOver(){
active=false;
$("screen").style.display="flex";
$("box").innerHTML=`
<h2>FIM DE <span>JOGO</span></h2>
<p>
A receção não aguentou!<br><br>
PONTOS: <b>${score}</b><br>
FASE ALCANÇADA: <b>${phase}</b><br>
RECORDE: <b>${best}</b>
</p>
<button id="restart">JOGAR NOVAMENTE</button>
`;
$("restart").onclick=startGame;
}
// ================================================
// PAUSA
// ================================================
function pause(){
if(!active)return;
active=false;
$("screen").style.display="flex";
$("box").innerHTML=`
<h2>JOGO <span>PAUSADO</span></h2>
<p>O hotel está à tua espera.</p>
<button id="resume">CONTINUAR</button>
`;
$("resume").onclick=()=>{
$("screen").style.display="none";
active=true;
};
}
// ================================================
// ATUALIZAÇÃO DO JOGO
// ================================================
function update(dt){
frame++;
if(!active)return;
// Temporizadores
spawnTimer+=dt;
  groupTimer+=dt;
thiefTimer+=dt;
blondeTimer+=dt;
bellhopTimer+=dt;
complaintTimer+=dt;
ghostTimer+=dt;
if(ghostPassed && odorTrail.length===0) odorTimer+=dt;
// ================================================
// APARECIMENTO DE GRUPOS
// ================================================
if(groupTimer>Math.max(300,550-phase*12)){
if(guests.filter(g=>!g.special).length<55){
createGroup();
}
groupTimer=0;
}
// ==============================================
==
// LADRÃO DOS 50 EUROS
// ENTRA PELA ESQUERDA E SAI PELA DIREITA
// ================================================
if(thiefTimer>rand(500,850)&&
!guests.some(g=>g.special==="thief")){
createSpecial("thief");
thiefTimer=0;
toast("ATENÇÃO! LADRÃO NO HOTEL! 50 EUROS!");
}
// ================================================
// MULHER LOIRA DO FOGO
// ================================================
if(blondeTimer>rand(650,1000)&&
!guests.some(g=>g.special==="blonde")){
createSpecial("blonde");
blondeTimer=0;
toast("FOGO! FOGO!");
// ================================================
// BAGAGEIRO
// ================================================
}
if(!guests.some(g=>g.special==="bellhop")&&
bellhopTimer>550){
createSpecial("bellhop");
bellhopTimer=0;
}
// ================================================
// HÓSPEDE QUE RECLAMA DO CHEIRO
// ================================================
if(ghostTimer>900&&!ghostActive&&!ghostPassed){ createSpecial("ghost"); ghostActive=true; ghostTimer=0; }
// HÓSPEDE QUE RECLAMA DO CHEIRO
// ================================================
if(ghostPassed && odorTrail.length===0 && odorTimer>100 && complaintTimer>rand(650,950)&&
   !guests.some(g=>g.special==="complainer")){
createSpecial("complainer");
complaintTimer=0; ghostPassed=false; odorTimer=0;
toast("UM HÓSPEDE ESTÁ A RECLAMAR DO CHEIRO!");
}
// ================================================
// RECECIONISTA APARECE OCASIONALMENTE
// ================================================
if(!receptionistVisible){
receptionistTimer+=dt;
if(receptionistTimer>rand(350,650)){
receptionistVisible=true;
receptionistDuration=rand(150,260);
receptionistTimer=0;
}
}else{
receptionistDuration-=dt;
if(receptionistDuration<=0){
receptionistVisible=false;
receptionistTimer=0;
} }
// ================================================
// HÓSPEDES INDIVIDUAIS
// ================================================
if(spawnTimer>Math.max(45,110-phase*5)){
if(guests.filter(g=>!g.special).length<55){
createGuest();
}
spawnTimer=0;
}
// ================================================
// MOVIMENTAÇÃO
// ================================================
for(let g of guests){
// BAGAGEIRO CAMINHA DA DIREITA PARA A ESQUERDA
if(g.special==="bellhop"){
g.walk+=.20*dt; g.x-=g.speed*dt; continue;
}
// MULHER DO FOGO
if(g.special==="blonde"){
g.walk+=.22*dt;
g.x+=(g.dir||1)*g.speed*dt;
if(g.x>W+g.r){
g.x=-g.r;
}
  continue;
}
// LADRÃO: ESQUERDA PARA DIREITA
if(g.special==="thief"){
g.walk+=.30*dt;
g.x+=g.speed*dt;
continue;
}
// FANTASMA E RASTO DE CHEIRO
if(g.special==="ghost"){
g.x-=g.speed*dt;
odorTrail.push({x:g.x+r*.25,y:g.y+rand(-5,8),life:95,max:95});
if(g.x < -g.r){ ghostActive=false; ghostPassed=true; }
continue;
}
// HÓSPEDE DO CHEIRO: DIREITA PARA ESQUERDA
if(g.special==="complainer"){
g.walk+=.15*dt;
g.x-=g.speed*dt;
continue;
}
// GRUPOS DE CLIENTES
if(g.queue){
let dx=g.targetX-g.x;
if(Math.abs(dx)>2){
g.x+=Math.sign(dx)*
Math.min(Math.abs(dx),g.speed*dt);
}
g.y+=(g.targetY-g.y)*.06*dt;
continue;
}
// HÓSPEDES NORMAIS
g.x-=g.speed*dt;
g.y+=Math.sin(frame*.03+g.bob)*.3*dt;
}
// ================================================
// PERSONAGENS QUE SAEM DO ECRÃ
// ================================================
for(let i=guests.length-1;i>=0;i--){
let g=guests[i];
// LADRÃO SAI PELA DIREITA
if(g.special==="thief"&&g.x>W+g.r){
guests.splice(i,1);
toast("O LADRÃO FUGIU COM OS 50 EUROS!");
continue;
}
// MULHER DO FOGO
if(g.special==="blonde"&&g.x>W+g.r){
guests.splice(i,1);
continue;
}
// HÓSPEDE DO CHEIRO
if(g.special==="complainer"&&g.x < -g.r){
guests.splice(i,1);
continue;
}
// HÓSPEDES NORMAIS
if(!g.special&&!g.queue&&g.x < -g.r){
guests.splice(i,1);
lives--;
combo=0;
toast("OUTRA RECLAMAÇÃO NÃO RESOLVIDA!");
if(lives<=0){
gameOver();
return;
}
updateHUD();
} }
// ================================================
// MOVIMENTO DAS FLECHAS
// ================================================
for(let a of arrows){
a.x+=a.vx*dt;
a.y+=a.vy*dt;
a.vy+=.045*dt;
a.angle=Math.atan2(a.vy,a.vx);
a.life-=dt;
// COLISÕES
for(let i=guests.length-1;i>=0;i--){
let g=guests[i];
if(a.hit.has(g.id))continue;
if(Math.hypot(a.x-g.x,a.y-g.y)<g.r*.8){
a.hit.add(g.id);
g.hp--;
  splash(g.x,g.y);
shake=5;
if(g.hp<=0){
// ================================================
// BAGAGEIRO ATINGIDO
// ================================================
if(g.special==="bellhop"){
guests.splice(i,1);
score+=150;
combo++;
toast("BAGAGEIRO ATINGIDO! A FILA CONTINUA!");
if(score>best){
best=score;
try{
localStorage.setItem("hotelBossRecord",best);
}catch(e){}
}
updateHUD();
break;
}
// ================================================
// OUTROS PERSONAGENS
// ================================================
guests.splice(i,1);
let points=100+combo*20+(g.special?75:0);
score+=points;
combo++;
// MULHER
if(g.special==="blonde"){
toast("A MULHER DO FOGO FOI ATINGIDA!");
}
// LADRÃO
else if(g.special==="thief"){
toast("LADRÃO APANHADO! 50 EUROS RECUPERADOS!");
score+=200;
}
// HÓSPEDE DO CHEIRO
else if(g.special==="complainer"){
toast("RECLAMAÇÃO DO CHEIRO RESOLVIDA!");
}
// CLIENTE NORMAL
else{
toast("CLIENTE RESOLVIDO! +"+points);
  }
// RECORDE
if(score>best){
best=score;
try{
localStorage.setItem("hotelBossRecord",best);
}catch(e){}
}
// CONTAGEM DE FASE
if(!g.special){
kills++;
nextPhase();
}
updateHUD();
}else{
toast("ACERTA OUTRA VEZ!");
}
break;
} } }
// REMOVER FLECHAS
arrows=arrows.filter(a=>
a.life>0&&
a.x<W+80&&
a.x>-80&&
a.y<H+80&&
a.y>-80
);
// SEM FLECHAS
if(ammo<=0&&arrows.length===0){
gameOver();
return;
}
// PARTÍCULAS
updateParticles(dt);
}
// ================================================
// DESENHAR TUDO
// ================================================
function draw(){
ctx.save();
if(shake>0){
  ctx.translate(
rand(-shake,shake),
rand(-shake,shake)
);
shake*=.8;
if(shake<.2)shake=0;
}
// CENÁRIO
background();
// RECECIONISTA
drawReceptionist();
// Rasto de cheiro de esgoto atrás do fantasma
for(const o of odorTrail){
ctx.globalAlpha=Math.min(.45,o.life/o.max);
ctx.fillStyle="#8aa56b";
ctx.beginPath(); ctx.ellipse(o.x,o.y,12+(1-o.life/o.max)*18,7,0,0,Math.PI*2); ctx.fill();
}
ctx.globalAlpha=1;
// PERSONAGENS
guests.forEach(g=>{
if(g.special){
drawSpecial(g);
}else{
drawGuest(g);
}
});
// FLECHAS
arrows.forEach(drawArrow);
// PARTÍCULAS
drawParticles();
// ARCO
let a=Math.atan2(
mouse.y-bow.y,
mouse.x-bow.x
);
ctx.save();
ctx.translate(bow.x,bow.y);
ctx.rotate(a);
ctx.strokeStyle="#d9a15c";
ctx.lineWidth=7;
ctx.beginPath();
ctx.arc(0,0,34,-1.1,1.1);
ctx.stroke();
ctx.restore();
// MIRA
ctx.strokeStyle="#ff6375";
ctx.lineWidth=1.5;
  ctx.beginPath();
ctx.arc(mouse.x,mouse.y,13,0,Math.PI*2);
ctx.stroke();
// COMBO
if(combo>1&&active){
ctx.textAlign="center";
ctx
.fillStyle="#ffdf86";
ctx.font="bold 23px Arial";
ctx.fillText(
"COMBO x"+combo,
W/2,
H*.26
);
}
ctx.restore();
}
// ================================================
// CICLO PRINCIPAL
// ================================================
function loop(time){
let dt=Math.min(
(time-last)/16.67||1,
2
);
last=time;
update(dt);
draw();
requestAnimationFrame(loop);
}
// ================================================
// CONTROLOS
// ================================================
canvas.addEventListener("pointermove",e=>{
let r=canvas.getBoundingClientRect();
mouse.x=e.clientX-r.left;
mouse.y=e.clientY-r.top;
});
canvas.addEventListener("pointerdown",e=>{
let r=canvas.getBoundingClientRect();
mouse.x=e.clientX-r.left;
mouse.y=e.clientY-r.top;
if(!active){
if($("screen").style.display==="none")return;
}else{
shoot();
}
});
$("mobileShoot").addEventListener("pointerdown",e=>{
  e.preventDefault();
shoot();
});
$("start").onclick=startGame;
$("exit").onclick=pause;
addEventListener("keydown",e=>{
if(e.key==="Escape")pause();
if(e.code==="Space"){
e.preventDefault();
shoot();
}
});
// ================================================
// COMEÇAR
// ================================================
updateHUD();
last=performance.now();
requestAnimationFrame(loop);
})();
</script>
