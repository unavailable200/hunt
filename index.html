
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel KIBOAS</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#151a20;color:white;
 font-family:Arial,sans-serif;
}

#game-wrap{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}

#start,#give-cigarette{
 position:absolute;left:50%;transform:translateX(-50%);
 padding:16px 25px;border:0;border-radius:12px;
 font-weight:bold;font-size:18px;cursor:pointer;
 z-index:5;
}

#start{
 top:50%;
 transform:translate(-50%,-50%);
 background:linear-gradient(135deg,#f4d18a,#d99d43);
}

#give-cigarette{
 bottom:3%;
 background:linear-gradient(135deg,#e5e5e5,#999);
 color:#222;
 display:none;
}

#give-cigarette:disabled{
 opacity:.5;cursor:default;
}
</style>
</head>

<body>
<div id="game-wrap">
<canvas id="game"></canvas>

<button id="start">COMEÇAR CENA</button>
<button id="give-cigarette">🚬 DAR CIGARRO</button>
</div>

<script>
(()=>{
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const giveButton=document.getElementById('give-cigarette');

let W=0,H=0,frame=0;
let running=false,arrived=false;
let waiterX=-250,targetX=0;
let smoking=false;
let cigaretteTaken=false;
let smoke=[];
let reactionTimer=0;
let armLift=0;

const image=new Image();
image.src='recepcao-jogo.jpg';

// VOZ EM PORTUGUÊS DE PORTUGAL
function speak(text){
 if(!('speechSynthesis' in window)){
  alert('Este navegador não suporta voz.');
  return;
 }

 window.speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(text);
 speech.lang='pt-PT';
 speech.rate=0.95;
 speech.pitch=1.0;
 speech.volume=1;

 const voices=window.speechSynthesis.getVoices();

 const portugueseVoice=voices.find(v=>
  v.lang.toLowerCase()==='pt-pt'
 );

 if(portugueseVoice){
  speech.voice=portugueseVoice;
 }

 window.speechSynthesis.speak(speech);
}

// Carregar vozes disponíveis
if('speechSynthesis' in window){
 window.speechSynthesis.onvoiceschanged=()=>{
  window.speechSynthesis.getVoices();
 };
}

function resize(){
 W=canvas.width=window.innerWidth;
 H=canvas.height=window.innerHeight;
 targetX=W*.55;
}

window.addEventListener('resize',resize);
resize();

function background(){
 ctx.fillStyle='#29231e';
 ctx.fillRect(0,0,W,H);

 if(image.complete && image.naturalWidth){
  const scale=Math.max(W/image.naturalWidth,H/image.naturalHeight);
  const sw=W/scale,sh=H/scale;

  ctx.drawImage(image,
   (image.naturalWidth-sw)/2,
   (image.naturalHeight-sh)/2,
   sw,sh,0,0,W,H);
 }else{
  ctx.fillStyle='#65462f';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e8bd72';
  ctx.font='bold 30px Arial';
  ctx.textAlign='center';
  ctx.fillText('HOTEL KIBOAS',W/2,H*.2);
 }

 ctx.fillStyle='#0005';
 ctx.fillRect(0,0,W,H);

 // Balcão da receção
 ctx.fillStyle='#4a3020';
 ctx.fillRect(W*.12,H*.69,W*.76,H*.17);

 ctx.fillStyle='#bd955d';
 ctx.fillRect(W*.12,H*.69,W*.76,9);

 ctx.fillStyle='#241914';
 ctx.fillRect(W*.12,H*.86,W*.76,H*.04);

 ctx.fillStyle='#f1d18b';
 ctx.font='bold 24px Georgia';
 ctx.textAlign='center';
 ctx.fillText('RECEPÇÃO — HOTEL KIBOAS',W*.5,H*.665);
}

// FUMO ANIMADO
function addSmoke(x,y){
 smoke.push({
  x:x+(Math.random()-0.5)*5,
  y:y,
  size:2+Math.random()*3,
  life:1,
  drift:(Math.random()-0.5)*.7
 });
}

function drawSmoke(){
 for(let i=smoke.length-1;i>=0;i--){
  const p=smoke[i];

  p.y-=.8;
  p.x+=p.drift;
  p.size+=.025;
  p.life-=.012;

  ctx.globalAlpha=Math.max(0,p.life)*.45;
  ctx.fillStyle='#eeeeee';

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;

  if(p.life<=0)smoke.splice(i,1);
 }
}

// GARÇOM GIGANTE
function drawWaiter(x,y){
 ctx.save();
 ctx.translate(x,y);

 const bob=Math.sin(frame*.06)*3;
 ctx.scale(10,10);

 // Sombra
 ctx.fillStyle='#0008';
 ctx.beginPath();
 ctx.ellipse(0,49,27,7,0,0,Math.PI*2);
 ctx.fill();

 // Pernas
 ctx.strokeStyle='#111316';
 ctx.lineWidth=12;
 ctx.lineCap='round';

 ctx.beginPath();
 ctx.moveTo(-7,14);
 ctx.lineTo(-9,43);
 ctx.moveTo(7,14);
 ctx.lineTo(9,43);
 ctx.stroke();

 // Sapatos
 ctx.strokeStyle='#08090a';
 ctx.lineWidth=7;

 ctx.beginPath();
 ctx.moveTo(-9,43);
 ctx.lineTo(-19,46);
 ctx.moveTo(9,43);
 ctx.lineTo(19,46);
 ctx.stroke();

 // Camisa
 ctx.fillStyle='#f7f5ee';

 ctx.beginPath();
 ctx.moveTo(-16,-22);
 ctx.lineTo(16,-22);
 ctx.lineTo(20,24);
 ctx.lineTo(-20,24);
 ctx.closePath();
 ctx.fill();

 // Gola
 ctx.fillStyle='#e4e0d8';

 ctx.beginPath();
 ctx.moveTo(-8,-22);
 ctx.lineTo(0,-11);
 ctx.lineTo(8,-22);
 ctx.closePath();
 ctx.fill();

 // Avental
 ctx.fillStyle='#efc52f';
 ctx.fillRect(-19,5,38,17);

 ctx.strokeStyle='#b98b17';
 ctx.lineWidth=1.5;
 ctx.strokeRect(-19,5,38,17);

 ctx.strokeStyle='#a77c16';
 ctx.strokeRect(-11,9,11,8);

 // Braço direito
 ctx.strokeStyle='#f7f5ee';
 ctx.lineWidth=9;
 ctx.lineCap='round';

 ctx.beginPath();
 ctx.moveTo(15,-14);

 if(cigaretteTaken){
  ctx.lineTo(24,-24);
  ctx.lineTo(10,-38+armLift);
 }else{
  ctx.lineTo(29,-27);
  ctx.lineTo(39,-37);
 }

 ctx.stroke();

 // Mão
 ctx.fillStyle='#d9a17e';

 ctx.beginPath();
 ctx.arc(
  cigaretteTaken?10:40,
  (cigaretteTaken?-38:-39)+bob+armLift,
  6,0,Math.PI*2
 );
 ctx.fill();

 // Cigarro
 if(cigaretteTaken){
  ctx.save();
  ctx.translate(10,-39+bob+armLift);
  ctx.rotate(-.25);

  ctx.fillStyle='#f5f0df';
  ctx.fillRect(-2,-2,13,3);

  ctx.fillStyle='#e95c28';
  ctx.fillRect(9,-2,3,3);

  ctx.restore();
 }

 // Braço esquerdo
 ctx.strokeStyle='#f7f5ee';
 ctx.lineWidth=9;

 ctx.beginPath();
 ctx.moveTo(-15,-14);
 ctx.lineTo(-25,8);
 ctx.stroke();

 // Pescoço
 ctx.fillStyle='#d9a17e';
 ctx.fillRect(-5,-31,10,13);

 // Cabeça
 ctx.fillStyle='#d9a17e';

 ctx.beginPath();
 ctx.ellipse(0,-40+bob,14,17,0,0,Math.PI*2);
 ctx.fill();

 // Cabelo
 ctx.fillStyle='#29211d';

 ctx.beginPath();
 ctx.moveTo(-14,-43+bob);
 ctx.quadraticCurveTo(-12,-62+bob,5,-58+bob);
 ctx.quadraticCurveTo(17,-55+bob,13,-39+bob);
 ctx.quadraticCurveTo(4,-49+bob,-4,-47+bob);
 ctx.closePath();
 ctx.fill();

 // OLHOS VERMELHOS QUANDO FUMA
 ctx.save();

 if(smoking){
  ctx.shadowColor='#ff0000';
  ctx.shadowBlur=14;
  ctx.fillStyle='#ff1010';
 }else{
  ctx.shadowBlur=0;
  ctx.fillStyle='#25201d';
 }

 ctx.beginPath();
 ctx.arc(-5,-40+bob,2,0,Math.PI*2);
 ctx.arc(5,-40+bob,2,0,Math.PI*2);
 ctx.fill();

 // Pequeno brilho nos olhos
 if(smoking){
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff';

  ctx.beginPath();
  ctx.arc(-5.5,-40.5+bob,.6,0,Math.PI*2);
  ctx.arc(4.5,-40.5+bob,.6,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();

 // Boca
 ctx.strokeStyle='#80513f';
 ctx.lineWidth=1;

 ctx.beginPath();

 if(smoking){
  ctx.arc(0,-33+bob,2,0,Math.PI*2);
 }else{
  ctx.moveTo(-3,-33+bob);
  ctx.quadraticCurveTo(0,-31+bob,3,-33+bob);
 }

 ctx.stroke();

 ctx.restore();
}

function draw(){
 background();

 drawWaiter(waiterX,H*.57);

 // Chegada à receção
 if(running && !arrived){
  waiterX+=2.2;

  if(waiterX>=targetX){
   waiterX=targetX;
   arrived=true;

   speak('Bom dia! Pode tirar uma cópia para mim, por favor?');

   giveButton.style.display='block';
  }
 }

 // Fumo a sair da boca
 if(smoking && frame%5===0){
  const mouthX=waiterX+5;
  const mouthY=H*.57-400;

  addSmoke(mouthX,mouthY);
 }

 drawSmoke();

 // Movimento do braço
 if(cigaretteTaken){
  armLift=smoking?Math.sin(frame*.12)*2:0;
 }

 // Reação depois de receber o cigarro
 if(reactionTimer>0){
  reactionTimer--;

  if(reactionTimer===0 && smoking){
   speak('Ahhh... que maravilha! Uma pausa para fumar! Agora sim, estou pronto para tirar fotocópias!');
  }
 }

 frame++;
 requestAnimationFrame(draw);
}

// COMEÇAR
start.addEventListener('click',()=>{
 running=true;
 arrived=false;
 smoking=false;
 cigaretteTaken=false;
 smoke=[];
 armLift=0;
 reactionTimer=0;

 waiterX=-250;

 start.style.display='none';
 giveButton.style.display='none';
 giveButton.disabled=false;
 giveButton.textContent='🚬 DAR CIGARRO';
});

// DAR CIGARRO
giveButton.addEventListener('click',()=>{
 if(!arrived || cigaretteTaken)return;

 cigaretteTaken=true;
 smoking=true;

 giveButton.disabled=true;
 giveButton.textContent='🚬 ALEX ESTÁ A FUMAR...';

 speak('O quê?! Um cigarro? Muito obrigado! Vou fazer uma pausa rapidinha!');

 reactionTimer=300;

 setTimeout(()=>{
  if(smoking){
   speak('Eh pá! Estou com os olhos a arder! Mas que pausa fantástica! Não te esqueças da fotocópia!');
  }
 },7000);
});

draw();

})();
</script>
</body>
</html>
